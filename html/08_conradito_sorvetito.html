<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conradito Sorvetito</title>
    <link rel="stylesheet" href="08_conradito_sorvetito.css">
</head>
<body>

    <!-- TELA DO JOGO -->
    <div id="telaJogo" class="container">
        <h1>Conradito Sorvetito</h1>
        <p class="saldo">Você tem 💲 <strong id="textoDinheiro">0</strong></p>

        <div class="area-sorvete">
            <img src="https://cdn-icons-png.flaticon.com/256/5965/5965330.png" alt="Sorvete" class="img-sorvete" onclick="fazerSorvete()">
            <p>Clique no sorvete para produzir!</p>
        </div>

        <hr/>

        <h2>Melhorias</h2>
        <ul class="lista-upgrades">
            <li>
                <span>Carrinho - 💲 <strong id="textoCarrinhoSorvete">25</strong></span>
                <button onclick="carrinhoSorvete()">COMPRAR</button>
            </li>
            <li>
                <span>Freezer Grande - 💲 1.000</span>
                <button disabled>COMPRAR</button>
            </li>
            <li>
                <span>Marca Gourmet - 💲 50.000</span>
                <button disabled>COMPRAR</button>
            </li>
        </ul>

        <div class="card-recompensa">
            <p>Entre com uma conta para ganhar 💲 1.000</p>
            <button onclick="resgatarRecompensa()">Resgatar recompensa</button>
        </div>

        <button onclick="irParaPainel()" class="btn-navegacao">Painel</button>
    </div>

    <!-- TELA DO PAINEL -->
    <div id="telaPainel" class="container" style="display: none;">
        <h1>Painel do Jogador</h1>
        <p>Estatísticas do seu império de sorvetes virão aqui!</p>
        
        <button onclick="irParaJogo()" class="btn-navegacao">Voltar ao Jogo</button>
    </div>

    <script>
        // Carrega dados salvos ou inicializa padrão
        let dinheiro = parseInt(localStorage.getItem("dinheiroSalvo")) || 0;
        let dinheiroPorClique = parseInt(localStorage.getItem("dinheiroPorCliqueSalvo")) || 1;
        let custoCarrinhoSorvete = parseInt(localStorage.getItem("custoCarrinhoSalvo")) || 25;

        // Renderiza a interface na abertura da página
        atualizarInterface();

        function atualizarInterface() {
            document.getElementById("textoDinheiro").innerHTML = dinheiro;
            document.getElementById("textoCarrinhoSorvete").innerHTML = custoCarrinhoSorvete;
        }

        function irParaPainel() {
            document.getElementById("telaJogo").style.display = "none";
            document.getElementById("telaPainel").style.display = "block";
        }

        function irParaJogo() {
            document.getElementById("telaPainel").style.display = "none";
            document.getElementById("telaJogo").style.display = "block";
        }

        function resgatarRecompensa() {
            if (localStorage.getItem("autenticado") == "1") {
                if (localStorage.getItem("recompensaResgatada") == "1") {
                    alert("Você já resgatou essa recompensa!");
                } else {
                    alert("Recompensa concedida!");
                    dinheiro += 1000;
                    localStorage.setItem("recompensaResgatada", "1");
                    salvarEAtualizar();
                }
            } else {
                alert("Você deve fazer login para continuar...");
            }
        }

        function fazerSorvete() {
            dinheiro += dinheiroPorClique;
            salvarEAtualizar();
        }

        function carrinhoSorvete() {
            if (dinheiro < custoCarrinhoSorvete) {
                alert("Dinheiro insuficiente...");
            } else {
                dinheiroPorClique += 1;
                dinheiro -= custoCarrinhoSorvete;
                custoCarrinhoSorvete += Math.floor(custoCarrinhoSorvete * 0.2);
                
                localStorage.setItem("dinheiroPorCliqueSalvo", dinheiroPorClique);
                localStorage.setItem("custoCarrinhoSalvo", custoCarrinhoSorvete);
                salvarEAtualizar();
            }
        }

        function salvarEAtualizar() {
            localStorage.setItem("dinheiroSalvo", dinheiro);
            atualizarInterface();
        }
    </script>
</body>
</html>
