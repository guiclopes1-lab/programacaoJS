<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conradito Sorvetito</title>
</head>
<body>

    <div id="telaJogo">
        <h1>Conradito Sorvetito</h1>
        <p>Voce tem 💲 <strong id="textoDinheiro">0</strong></p>

        <img src="https://cdn-icons-png.flaticon.com/256/5965/5965330.png" width="80" onclick="fazersorvete()" style="cursor: pointer;">

        <hr/>

        <ul>
            <li>Carrinho de Sorvete - 💲 <strong id="textocarrinhoSorvete">25</strong> <button onclick="carrinhoSorvete()">COMPRAR</button></li>
            <li>Freezer Grande - 💲 1.000 <button>COMPRAR</button></li>
            <li>Marca Gourmet 💲 50.00 <button>COMPRAR</button></li>
        </ul>

        <p>Entre com uma conta para ganhar 💲 1.000 <button onclick="resgataraRecompensa()">Resgatar recompensa</button></p>

        <button onclick="irParaPainel()"> Painel</button>
    </div>

    <div id="telaPainel" style="display: none;">
        <h1>Painel </h1>
        <p> Painel</p>
        
        <button onclick="irParaJogo()">Voltar</button>
    </div>

    <script>
    let dinheiro = 0;
    if (localStorage.getItem("dinheiroSalvo") != null) {
        dinheiro = parseInt(localStorage.getItem("dinheiroSalvo"));
    }

    let dinheiroporclique = 1;
    let custocarrinhosorvete = 25;

    document.getElementById("textoDinheiro").innerHTML = dinheiro;

    function irParaPainel() {
        document.getElementById("telaJogo").style.display = "none";
        document.getElementById("telaPainel").style.display = "block";
    }

    function irParaJogo() {
        document.getElementById("telaPainel").style.display = "none";
        document.getElementById("telaJogo").style.display = "block";
    }

    function resgataraRecompensa(){
        // Verifica se tá autenticado E se ainda NÃO resgatou
        if(localStorage.getItem("autenticado") == 1){
            
            if(localStorage.getItem("recompensaResgatada") == 1){
                alert("Você já resgatou essa recompensa!");
            } else {
                alert("Recompensa concedida!");
                dinheiro += 1000;
                
                localStorage.setItem("recompensaResgatada", 1);
                
                localStorage.setItem("dinheiroSalvo", dinheiro);
                document.getElementById("textoDinheiro").innerHTML = dinheiro;
            }

        } else {
            alert("Voce deve fazer login para continuar...");
        }
    }
    
    
    function fazersorvete(){
        dinheiro += dinheiroporclique;
        
        
        localStorage.setItem("dinheiroSalvo", dinheiro);
        
        document.getElementById("textoDinheiro").innerHTML = dinheiro;
    }

    function carrinhoSorvete(){
        if(dinheiro < custocarrinhosorvete){
            alert("Dinheiro insuficiente...");
        } else {
            dinheiroporclique += 1;
            dinheiro -= custocarrinhosorvete;
            
            localStorage.setItem("dinheiroSalvo", dinheiro);
            
            document.getElementById("textoDinheiro").innerHTML = dinheiro;
            custocarrinhosorvete += parseInt(custocarrinhosorvete * 0.2);
            document.getElementById("textocarrinhoSorvete").innerHTML = custocarrinhosorvete;
        }
    }
    </script>

</body>
</html>
