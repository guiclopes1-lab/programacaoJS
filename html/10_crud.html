<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link rel="stylesheet" href="10.css">
</head>

<body>
        <h1>CRUD</h1>
        <P>Creat  (Inserir)</P>
        <P>Read   (Buscar)</P>
        <P>Update (Alterar)</P>
        <P>Delete (Remover)</P>
        
        <hr/>

        <input  id="inputnome" placeholder="Digite um nome"/>
        <button id="botaosalvar" onclick="inserir()" >Salvar</button>
        <button id="botaoalterar" style="display: none;" onclick="salvaralteracao()">Salvar alterações</button>
        
        <ul id="listausuarios">
            
        </ul>
        
        <script>

            // Dados mockados (Pensar na estrutura)

            let nomes = ["Conrado", "Caio","Felipe", "Rafael"] //Array
          
            let posicaoalteracao = 0

            buscartodos()

            function remover(nome){
                  
                  let resposta = confirm("Tem certeza que dejesa remover?")
                  if(resposta == false){
                    return
                  }

                  let posicaoremocao = nomes.indexOf(nome)
                  nomes.splice(posicaoalteracao, 1)
                  buscartodos()
            }

            function salvaralteracao(){
                  let nome = document.getElementById("inputnome").value
                buscartodos()
                document.getElementById("inputnome").value = ""
                if(nome.trim().length < 3){
                    alert("Digite um nome válido...")
                    return

                } else{
                    nomes[posicaoalteracao] = nome
                    buscartodos()
                    document.getElementById("inputnome").value = ""
                }

            }

            function atualizar(nome){

                posicaoalteracao = nomes.indexOf(nome)

                document.getElementById("inputnome").value = nome

                document.getElementById("botaosalvar").style.display = "none"
                document.getElementById("botaoalterar").style.display = "inline-block"




            }

            function inserir(){
                let nome = document.getElementById("inputnome").value
                
                buscartodos()
                document.getElementById("inputnome").value = ""
                if(nome.trim().length < 3){
                    alert("Digite um nome válido...")
                    return

                } else{
                    nomes = nomes.concat(nome)
                    buscartodos()
                    document.getElementById("inputnome").value = ""
                }

            }

            function buscartodos(){
                let html = ""
                nomes.map( i => html += `<li> ${i} <button onclick='atualizar("${i}")'>🖊<button onclick= 'remover("${i}")'>🗑</button></li>` )
                document.getElementById("listausuarios").innerHTML = html
                
            }


        </script>
        
</body>
</html>
